name: Build Expo Android APK

on:
  push:
    branches: [ "New-Main" ]
  pull_request:
    branches: [ "New-Main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install NPM Dependencies
      run: cd Frontend && npm install

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Generate Native Android Code (Expo Prebuild)
      run: cd Frontend && npx expo prebuild --platform android --clean

    - name: Make Gradle Executable
      run: cd Frontend/android && chmod +x ./gradlew

    - name: Build Release APK
      run: cd Frontend/android && ./gradlew assembleRelease

    - name: Upload APK to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: resiido-expo-apk
        path: Frontend/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 14