name: Build Expo Android APK

on:
  push:
    branches: [ "New-Main" ]
  pull_request:
    branches: [ "New-Main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm install

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Generate Native Android Code (Expo Prebuild)
      # This forces Expo to generate the /android folder so we can build it
      run: npx expo prebuild --platform android --clean

    - name: Make Gradle Executable
      run: cd android && chmod +x ./gradlew

    - name: Build Release APK
      # Compiles the actual Android app
      run: cd android && ./gradlew assembleRelease

    - name: Upload APK to GitHub
      # Grabs the finished APK and puts it on your GitHub page for download
      uses: actions/upload-artifact@v4
      with:
        name: resiido-expo-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 14